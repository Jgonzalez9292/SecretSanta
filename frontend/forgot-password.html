<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body class="login-page">

    <div class="join-background">
        <div class="join-glow join-glow-one"></div>
        <div class="join-glow join-glow-two"></div>
    </div>

    <main class="login-shell">

        <section class="login-card">

            <div class="join-brand">
                <span class="join-brand-mark">🎁</span>
                <span>Secret Santa</span>
            </div>

            <div class="login-intro">

                <p class="join-eyebrow">
                    Password Reset
                </p>

                <h1>
                    Forgot Your Password?
                </h1>

                <p>
                    Enter the email address for your organizer account.
                    We'll send you a password reset link.
                </p>

            </div>

            <form id="forgot-password-form">

                <div class="form-field">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="you@example.com"
                        required
                    >

                </div>

                <button
                    type="submit"
                    class="primary-button login-submit-button"
                >
                    Send Reset Link
                </button>

            </form>

            <p id="message"></p>

            <p class="login-signup">
                <a href="login.html">
                    Back to Log In
                </a>
            </p>

        </section>

    </main>

    <script src="js/config.js?v=2"></script>
    <script src="js/forgot-password.js?v=2"></script>

</body>
</html>

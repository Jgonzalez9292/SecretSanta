<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Secret Santa</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <main class="container">

        <h1>Create an Exchange</h1>

        <form id="create-exchange-form">

            <label for="name">Exchange name</label>
            <input
                type="text"
                id="name"
                required
            >

            <label for="code">Family code</label>
            <input
                type="text"
                id="code"
                required
            >

            <label for="budget">Budget</label>
            <input
                type="number"
                id="budget"
                min="0"
                step="0.01"
            >

            <label for="registration-deadline">
                Registration deadline
            </label>
            <input
                type="datetime-local"
                id="registration-deadline"
            >

            <label for="draw-date">Draw date</label>
            <input
                type="datetime-local"
                id="draw-date"
            >

            <button type="submit">
                Create Exchange
            </button>

        </form>

        <p id="message"></p>

    </main>

    <script src="js/create.js"></script>

</body>
</html>

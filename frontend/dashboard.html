<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Secret Santa Dashboard</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >
</head>

<body class="dashboard-page">

    <div class="join-background">
        <div class="join-glow join-glow-one"></div>
        <div class="join-glow join-glow-two"></div>
    </div>

    <main class="dashboard-shell">

        <section class="dashboard-card">

            <header class="dashboard-header">

                <div class="join-brand">
                    <span class="join-brand-mark">
                        🎁
                    </span>

                    <span>
                        Secret Santa
                    </span>
                </div>


                <button
                    id="logout-button"
                    class="dashboard-logout-button"
                    type="button"
                >
                    Log Out
                </button>

            </header>


            <div class="dashboard-hero">

                <div>

                    <p class="join-eyebrow">
                        Organizer Dashboard
                    </p>

                    <h1>
                        Your Secret Santa Exchanges
                    </h1>

                    <p
                        id="welcome"
                        class="dashboard-welcome"
                    ></p>

                </div>


                <a
                    href="create.html"
                    class="create-exchange-button"
                >
                    Create New Exchange
                </a>

            </div>


            <section class="dashboard-section">

                <div class="organizer-section-heading">

                    <h2>Your Exchanges</h2>

                    <p>
                        Manage participants, deadlines,
                        exclusions, draws, and assignment emails.
                    </p>

                </div>


                <div id="exchange-list"></div>

            </section>

        </section>

    </main>


    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/dashboard.js"></script>

</body>
</html>

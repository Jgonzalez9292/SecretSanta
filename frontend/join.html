<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join Secret Santa</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <main class="container">

        <h1 id="exchange-name"></h1>

        <p id="exchange-budget"></p>

        <form id="participant-form">

            <label for="name">Name</label>
            <input
                type="text"
                id="name"
                required
            >

            <label for="email">Email</label>
            <input
                type="email"
                id="email"
                required
            >

            <label for="interests">Interests</label>
            <textarea id="interests"></textarea>

            <label for="wishlist">Wishlist</label>
            <textarea id="wishlist"></textarea>

            <button type="submit">
                Join Exchange
            </button>

        </form>

        <section id="pending-registration" hidden>

            <h2>Check your email</h2>

            <p>
                We sent a confirmation link to:
            </p>

            <p>
                <strong id="pending-email"></strong>
            </p>

            <p>
                You need to confirm your email before
                you're included in the Secret Santa draw.
            </p>

            <button
                id="resend-confirmation-button"
                type="button"
            >
                Resend Confirmation
            </button>

            <button
                id="change-email-button"
                type="button"
            >
                Change Email
            </button>

            <form id="change-email-form" hidden>

                <label for="new-email">
                    New email address
                </label>

                <input
                    type="email"
                    id="new-email"
                    required
                >

                <button type="submit">
                    Save New Email
                </button>

                <button
                    id="cancel-email-change-button"
                    type="button"
                >
                    Cancel
                </button>

            </form>

        </section>

        <p id="message"></p>

    </main>

    <script src="js/config.js"></script>
    <script src="js/join.js"></script>

</body>
</html>

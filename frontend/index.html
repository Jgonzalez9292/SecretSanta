<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secret Santa</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <main class="container">

        <h1>Secret Santa</h1>

        <section>
            <h2>Join an exchange</h2>

            <form id="join-form">
                <label for="exchange-code">Family code</label>

                <input
                    type="text"
                    id="exchange-code"
                    required
                >

                <button type="submit">
                    Continue
                </button>
            </form>
        </section>

        <section>
            <h2>Organizing an exchange?</h2>

            <p>
                <a href="login.html">Log in</a>
                or
                <a href="signup.html">Create an account</a>
            </p>
        </section>

        <p id="message"></p>

    </main>

    <script src="js/config.js"></script>
    <script src="js/app.js"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Confirm Secret Santa Registration</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >
</head>

<body class="verify-page">

    <div class="join-background">
        <div class="join-glow join-glow-one"></div>
        <div class="join-glow join-glow-two"></div>
    </div>

    <main class="verify-shell">

        <section class="verify-card">

            <div class="join-brand">
                <span class="join-brand-mark">
                    🎁
                </span>

                <span>
                    Secret Santa
                </span>
            </div>


            <div class="verify-icon">
                ✉️
            </div>


            <p class="join-eyebrow">
                Almost there
            </p>


            <h1 id="verification-title">
                Confirm your registration
            </h1>


            <p id="verification-message">
                Confirm your email to join the Secret Santa draw.
            </p>


            <button
                id="confirm-registration-button"
                type="button"
                hidden
            >
                Confirm Registration
            </button>


            <a
                href="index.html"
                id="home-link"
                class="verify-home-link"
                hidden
            >
                Back to Secret Santa
            </a>

        </section>

    </main>


    <script src="js/config.js"></script>
    <script src="js/verify.js"></script>

</body>
</html>

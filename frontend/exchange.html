<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Exchange</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <main class="container">

        <h1 id="exchange-name">Manage Exchange</h1>

        <p id="exchange-code"></p>
        <p id="exchange-budget"></p>
        <p id="registration-deadline"></p>
        <p id="draw-date"></p>

        <button id="edit-button">
        Edit Exchange
        </button>

        <form id="edit-form" hidden>

            <label for="edit-name">Exchange name</label>
            <input
                type="text"
                id="edit-name"
            >

            <label for="edit-budget">Budget</label>
            <input
                type="number"
                id="edit-budget"
                min="0"
                step="0.01"
            >

            <label for="edit-registration-deadline">
                Registration deadline
            </label>
            <input
                type="datetime-local"
                id="edit-registration-deadline"
            >

            <label for="edit-draw-date">
                Draw date
            </label>
            <input
                type="datetime-local"
                id="edit-draw-date"
            >

            <button type="submit">
                Save Changes
            </button>

            <button id="draw-button">
                Run Secret Santa Draw
            </button>

        </form>

        <h2>Participants</h2>

        <div id="participant-list"></div>

        <p id="message"></p>

        <a href="dashboard.html">
            Back to Dashboard
        </a>

    </main>

    <script src="js/exchange.js"></script>

</body>
</html>

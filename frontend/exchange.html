<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Exchange</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <main class="container">

        <h1 id="exchange-name">Manage Exchange</h1>

        <p id="exchange-code"></p>
        <p id="exchange-budget"></p>
        <p id="registration-deadline"></p>
        <p id="draw-date"></p>
        <p id="draw-status"></p>
        <p id="email-status"></p>

        <button id="edit-button">
        Edit Exchange
        </button>

        <form id="edit-form" hidden>

            <label for="edit-name">Exchange name</label>
            <input
                type="text"
                id="edit-name"
            >

            <label for="edit-budget">Budget</label>
            <input
                type="number"
                id="edit-budget"
                min="0"
                step="0.01"
            >

            <label for="edit-registration-deadline">
                Registration deadline
            </label>
            <input
                type="datetime-local"
                id="edit-registration-deadline"
            >

            <label for="edit-draw-date">
                Draw date
            </label>
            <input
                type="datetime-local"
                id="edit-draw-date"
            >

            <button type="submit">
                Save Changes
            </button>

        </form>

        <button id="draw-button">
            Run Secret Santa Draw
        </button>

        <button id="send-emails-button" type="button">
            Send Assignment Emails
        </button>

        <h2>Participants</h2>

        <div id="participant-list"></div>


        <section id="exclusions-section">

            <h2>Match Exclusions</h2>

            <p>
                Choose two participants who should not
                draw each other.
            </p>

            <div id="exclusion-controls">

                <select id="exclusion-participant-a">
                    <option value="">
                        Select participant
                    </option>
                </select>

                <span>↔</span>

                <select id="exclusion-participant-b">
                    <option value="">
                        Select participant
                    </option>
                </select>

                <button
                    id="add-exclusion-button"
                    type="button"
                >
                    Add Exclusion
                </button>

            </div>

            <div id="exclusion-list"></div>

        </section>


        <p id="message"></p>

        <button id="delete-exchange-button" type="button">
            Delete Exchange
        </button>

        <a href="dashboard.html">
            Back to Dashboard
        </a>

    </main>

    <script src="js/config.js?v=2"></script>
    <script src="js/exchange.js?v=2"></script>

</body>
</html>
